name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt flake8

      - name: Lint
        run: flake8 app tests

      - name: Testy
        run: pytest

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z pełną historią
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skan sekretów (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Build obrazu
        run: docker build -t devsecops-app:scan .

      - name: Skan obrazu (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-app:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
